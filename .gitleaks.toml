# Gitleaks allowlist — narrow, justified, path-scoped.
#
# The only findings are `generic-api-key` hits on OCI image references that
# the build workflow itself writes into evidence files:
#
#   docs/RECRUITER-EVIDENCE.md        human-written, cites the image ref
#   docs/evidence/images/factory-api.json   written by build-container.yml
#
# A `ghcr.io/.../image:sha256digest` string matches generic-api-key on entropy
# alone. It is a content address, not a credential, and suppressing the whole
# rule would blind the scanner to real keys.
#
# Path-scoped, not rule-scoped: any other file still fails on generic-api-key.
title = "Factory-Data-Automation platform: gitleaks allowlist"

# CRITICAL: a custom config REPLACES the default rule set unless extended.
# Without this, the scanner runs zero rules and the allowlist below would
# vacuous-pass while blinding the repo. Verified: removing this block makes
# even an injected github-pat invisible.
[extend]
useDefault = true

[[allowlists]]
description = "OCI image references (ghcr.io factory-api tag/digest), not credentials"
# AND, not the default OR: under OR a matching path skips the WHOLE FILE
# before findings are evaluated (verified via --log-level=trace against the
# gitleaks 8.28.0 source), which would blind these files to real credentials
# added later. AND requires path AND regex to both match.
condition = "AND"
paths = [
  '''docs/evidence/images/''',
  '''docs/RECRUITER-EVIDENCE\.md''',
]
# regexTarget "line": the finding SECRET is only the entropy string and can
# never carry the ghcr.io prefix, so matching the line is what makes the
# path+regex pair a true intersection.
regexTarget = "line"
# Narrow: a finding must match BOTH the path AND one of these regexes,
# so a real credential added to these files still fails the scan.
#
# Three shapes of the same fact appear in evidence:
#   1. ghcr.io/.../factory-api:<tag>       image reference
#   2. ghcr.io/.../factory-api@sha256:...  digest-pinned reference
#   3. `sha256:<64 hex>`                   the bare digest, cited on its own
# All three are content addresses. Case 3 was added after CI flagged it: the
# digest was written without the registry prefix, so the ghcr.io pattern missed
# it and the scan failed on a document that contains no secret.
regexes = [
  '''ghcr\.io/\S*factory-api\S*''',
  '''\bsha256:[a-f0-9]{64}\b''',
]
