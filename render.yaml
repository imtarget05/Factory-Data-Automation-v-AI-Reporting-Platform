# ── Factory Data Automation v AI Reporting Platform — Render free-tier blueprint ──
# 2 free web services, region frankfurt (same as MAIA / ApexInspect-AI).
# Deploy: push this file on main → Render auto-detects render.yaml (Blueprint),
# then fill the sync:false secrets in the Render Dashboard (never commit values).
#
# 512MB RAM RATIONALE (Render free plan = 512MB per service):
#   - UVICORN_WORKERS=1 → a single uvicorn worker. Each extra worker duplicates
#     the pandas/polars + plotly import footprint (~150-250MB each) and OOMs the
#     512MB container. Same reason MAIA/Apex run single-process on free tier.
#   - python:3.11-slim base (see factory/Dockerfile) — no gunicorn, no extra
#     sidecars; ETL runs in-process on startup (lifespan refresh_data), cached
#     in memory instead of a second worker/scheduler container.
#   - Streamlit dashboard is a SEPARATE free service (not a second process in
#     the API container) so each gets its own 512MB budget.
services:
  - type: web
    name: factory-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./factory/Dockerfile
    dockerContext: .
    # Overrides the Dockerfile default CMD (streamlit) — this service is the API.
    dockerCommand: uvicorn app.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Secrets on the Render dashboard (Settings → Environment), NOT in git:
    #   DATABASE_URL    = <Neon/Supabase Postgres connection string>
    #   OPENAI_API_KEY  = <OpenAI key, optional — chat/report cloud fallback>
    #   GEMINI_API_KEY  = <Gemini key, optional>
    #   LLM_PROVIDER    = local_openai | ollama | lmstudio (default local_openai)
    #   LOCAL_LLM_URL   = <LAN llm-gateway URL, e.g. http://<host>:8787/v1>
    #   LOCAL_LLM_MODEL = <model name, e.g. qwen2.5-vl-3b-instruct>
    envVars:
      - key: UVICORN_WORKERS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: LLM_PROVIDER
        value: local_openai
      - key: LOCAL_LLM_MODEL
        value: qwen2.5-vl-3b-instruct
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LOCAL_LLM_URL
        sync: false

  - type: web
    name: factory-dashboard
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./factory/Dockerfile
    dockerContext: .
    # Same image as the API (factory/ dir supports both entrypoints — see
    # factory/docker-compose.yml: `api` overrides CMD with uvicorn, `dashboard`
    # with streamlit). This service keeps the Dockerfile default streamlit CMD,
    # pinned to Render's injected $PORT.
    dockerCommand: streamlit run app/dashboard/run.py --server.port=$PORT --server.address=0.0.0.0 --server.headless true
    # Streamlit has no /health endpoint — the MAIA maia-ui service uses `/`
    # for the same reason; Render treats HTTP 200 on / as healthy.
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: UVICORN_WORKERS
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
      - key: FACTORY_API_URL
        sync: false
        # Backend API URL — update in Render Dashboard after first deploy.
        # Example: https://factory-api.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
