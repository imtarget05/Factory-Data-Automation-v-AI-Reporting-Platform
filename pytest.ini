[pytest]
testpaths = tests
markers =
    adversarial: CSV-formula injection and export-sanitizer attack tests
    race: ETL idempotency / double-run / aggregation property tests
    live: tests requiring a live LLM gateway or model endpoint (skipped unless LIVE_TESTS=1)
    infra: tests requiring live infrastructure (DB, Ollama); skipped unless LIVE_TESTS=1
