# Cluster: factory — Factory Data Automation + AI Reporting.
# Quản trị theo cụm: xem scripts/docker-clusters.sh + docs/docker-clusters.md
# Shared infra: network portfolio-net (external) dùng chung cross-cluster khi cần.
name: factory

services:
  dashboard:
    container_name: factory-dashboard
    build:
      context: ..
      dockerfile: factory/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../.env:/app/.env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: streamlit run app/dashboard/run.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
    networks:
      - default
      - portfolio-net

  api:
    container_name: factory-api
    build:
      context: ..
      dockerfile: factory/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../.env:/app/.env
    # NOTE: no --reload here. The ETL lifespan writes processed/*.parquet under
    # /app on every boot; the reloader watches /app and would reboot forever.
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped
    networks:
      - default
      - portfolio-net

networks:
  portfolio-net:
    external: true
    name: portfolio-net