version: '3.8'

services:
  dashboard:
    container_name: factory-dashboard
    build:
      context: ..
      dockerfile: factory/Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - ../data:/app/data
      - ../.env:/app/.env
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    command: streamlit run app/dashboard/run.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped

  api:
    container_name: factory-api
    build:
      context: ..
      dockerfile: factory/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../.env:/app/.env
    # NOTE: no --reload here. The ETL lifespan writes processed/*.parquet under
    # /app on every boot; the reloader watches /app and would reboot forever.
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --workers 1
    restart: unless-stopped