name: IaC Validation

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/iac-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/iac-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Bicep CLI install is gone with the Bicep stack. Terraform replaces
      # it, pinned to the version the plan-invariant suite was measured on.
      #
      # Pinned, not "latest": a moving tag means the validator's behaviour can
      # change without a commit, and a provider/CLI upgrade is exactly the kind
      # of change that should be reviewable. Bump this deliberately.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.3'
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Python test deps (pytest for the checker self-tests)
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Run IaC Validation
        run: |
          chmod +x infra/validate.sh
          ./infra/validate.sh
