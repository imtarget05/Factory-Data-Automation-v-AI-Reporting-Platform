name: IaC Validation

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/iac-validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/iac-validate.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        # The `azure/setup-bicep` action this step used to call no longer exists
        # (github.com/azure/setup-bicep returns 404), and that is why the IaC
        # Validation job has been failing since it was added. The Bicep CLI is
        # still published as a plain release binary, so install it directly and
        # PIN the version.
        #
        # Pinned, not "latest": a moving tag means the validator's behaviour can
        # change without a commit, and a compiler upgrade is exactly the kind of
        # change that should be reviewable. Bump this deliberately.
        run: |
          BICEP_VERSION="0.47.16"
          curl -sSfL -o /usr/local/bin/bicep \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          chmod +x /usr/local/bin/bicep
          bicep --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run IaC Validation
        run: |
          chmod +x infra/validate.sh
          ./infra/validate.sh
