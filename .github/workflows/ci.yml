name: CI/CD Pipeline — Factory Data Automation Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: factory-data-platform

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check app/ tests/

      - name: Run Ruff format check
        run: ruff format --check app/ tests/

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      # data/raw/*.csv is gitignored, so a fresh CI checkout has no input data.
      # Generate it explicitly here so CI and a local clone run the exact same
      # sequence. tests/conftest.py keeps an autouse guard for anyone who runs
      # pytest directly without this step.
      - name: Generate deterministic sample data
        run: python -m scripts.generate_sample_data

      - name: Run tests with coverage (fast only — live/infra run in ci-live.yml)
        # Test isolation: live/infra-marked tests need real LLM/infra endpoints
        # and never run in the default job (markers registered in pytest.ini,
        # hence --strict-markers). --cov kept as-is, no fail-under (baseline
        # not yet locked); codecov upload below is unchanged.
        run: |
          python -m pytest tests/ -v \
            -m "not live and not infra" --strict-markers \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  gitleaks:
    # Secret scanning — HARD GATE (default config). Fails the build on leaks.
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2

  pip-audit:
    # Dependency audit — ADVISORY (continue-on-error) until triaged.
    # The offline dev env means advisories cannot be pre-triaged here, so a
    # hard gate would fail the build on unactionable findings. Ratchets to
    # blocking (remove continue-on-error) after triage — see HARD_TEST_REPORT.
    name: Dependency audit (pip-audit, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Run pip-audit (advisory — see job comment)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install safety bandit

      - name: Run Safety check (dependency vulnerabilities)
        run: safety check -r requirements.txt --output json || true
        continue-on-error: true

      - name: Run Bandit (code security)
        run: bandit -r app/ -f json -o bandit-report.json --severity-level medium || true
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: factory/Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
