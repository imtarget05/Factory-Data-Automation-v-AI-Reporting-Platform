name: CI/CD Pipeline — Factory Data Automation Platform

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: factory-data-platform

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check app/ tests/

      - name: Run Ruff format check
        run: ruff format --check app/ tests/

  test:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest

    # W2-2 migrations must be proven against a REAL PostgreSQL. SQLite has no
    # transactional DDL and different index/constraint semantics, and the first
    # defect this service container exists to catch was a DuplicateTable that
    # only appears when a rename carries an index forward on a real server.
    #
    # The migration suite EXITS rather than skips when this is missing, so
    # without the service below CI fails loudly instead of reporting green with
    # zero migration observations.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: factory
          POSTGRES_PASSWORD: factory
          POSTGRES_DB: factory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U factory"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      FACTORY_TEST_PG_ADMIN_URL: postgresql+psycopg2://factory:factory@localhost:5432/factory

    steps:
      - uses: actions/checkout@v4

      # The observation contract, in CI: prove the server is PostgreSQL 16 and
      # is reachable BEFORE any migration test runs. A green job that never
      # contacted a database is precisely the failure mode being prevented.
      # Readiness itself is handled by the service `options` health-cmd above;
      # this step is the assertion, not the wait.
      - name: Prove the migration database is real and reachable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import psycopg2

          conn = psycopg2.connect(
              host="localhost", port=5432, dbname="factory",
              user="factory", password="factory",
          )
          cur = conn.cursor()
          cur.execute(
              "select version(), current_database(), "
              "current_setting('server_version_num')"
          )
          version, database, num = cur.fetchone()
          print("version   :", version)
          print("database  :", database)
          print("server_ver:", num)
          assert int(num) >= 160000, (
              f"W2-2 requires PostgreSQL 16+, got server_version_num={num}"
          )
          print("MIGRATION DB CONTRACT SATISFIED")
          PY

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov

      # alembic is the migration framework (W2-2). Pinned exactly, because the
      # migration chain is executed rather than only parsed, so a minor
      # version can change what `upgrade head` does.
      - name: Install the migration framework
        run: pip install "alembic==1.20.0"

      # data/raw/*.csv is gitignored, so a fresh CI checkout has no input data.
      # Generate it explicitly here so CI and a local clone run the exact same
      # sequence. tests/conftest.py keeps an autouse guard for anyone who runs
      # pytest directly without this step.
      #
      # This is the documented canonical workflow:
      #   git clone -> generate fixture -> verify fixture metadata -> run tests
      # The verify step is what makes "deterministic" a checked claim rather
      # than a comment: it compares the freshly generated CSVs against the
      # committed manifest in docs/expected/ and fails the build on any drift.
      - name: Generate deterministic test fixture
        run: python -m scripts.generate_test_data

      - name: Verify fixture metadata (schema, seed, row counts, sha256)
        run: python -m scripts.verify_fixture --blessed docs/expected/factory-fixture.json

      - name: Run tests with coverage (fast only — live/infra run in ci-live.yml)
        # Test isolation: live/infra-marked tests need real LLM/infra endpoints
        # and never run in the default job (markers registered in pytest.ini,
        # hence --strict-markers). --cov kept as-is, no fail-under (baseline
        # not yet locked); codecov upload below is unchanged.
        run: |
          python -m pytest tests/ -v \
            -m "not live and not infra" --strict-markers \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml

      # WHY THIS STEP EXISTS. The migration suite exits rather than skips when
      # there is no database, so a green run cannot silently mean "zero migration
      # tests ran". But the converse also has to be impossible: a green job where
      # the migration file silently failed to COLLECT would report success with
      # nothing proven. So the count is read out of the JUnit XML that was just
      # written and asserted against a floor.
      #
      # 10 is the current number of real-PostgreSQL proofs (M1 x3, M2 B1-B5 x4,
      # M3 x2, M4 x2). A drop below it means collection broke, and a silent
      # collection break is exactly how "migrations verified" becomes a claim
      # nobody checked.
      - name: Assert the migration proofs actually executed
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse("test-results.xml")
          executed = 0
          failed = 0
          for case in tree.iter("testcase"):
              name = case.get("classname") or ""
              if "test_migrations_real_pg" in name:
                  executed += 1
                  if any(child.tag in {"failure", "error"} for child in case):
                      failed += 1

          print(f"migration proofs executed: {executed} (failures: {failed})")
          if executed < 10:
              print(
                  f"FAIL: expected at least 10 real-PostgreSQL migration proofs, "
                  f"saw {executed}. Collection is silently broken.",
                  file=sys.stderr,
              )
              raise SystemExit(1)
          print("MIGRATION PROOF COUNT OK")
          PY

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  gitleaks:
    # Secret scanning — HARD GATE (repo .gitleaks.toml). Fails on leaks.
    #
    # WHY THE CLI AND NOT gitleaks-action@v2. The action decides whether a
    # license is required by asking the GitHub API who owns the repository, and
    # since the v2 token change it also requires GITHUB_TOKEN to scan a
    # pull_request at all. On this repository the action failed the PR run with
    # "GITHUB_TOKEN is now required to scan pull requests" while the identical
    # push run was green.
    #
    # Same repository, same revision, opposite verdict decided by the event
    # type. That failure mode is the real problem: a scanner that goes red for a
    # reason unrelated to the tree teaches people to re-run it, and re-running
    # until green is how a genuine finding gets waved through. The pinned CLI has
    # no license gate and makes no API call, so the same tree gives the same
    # verdict on every event.
    #
    # The version is pinned WITH its SHA256, verified against the published
    # asset. Unpinned, a gitleaks release that adds a rule turns a green main red
    # on an unrelated PR; unchecked, a substituted asset runs with the scanner's
    # own privileges.
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.28.0
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          curl -sSfL "$url" -o /tmp/gitleaks.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # THE GATE. The working tree only: this is what a new commit can break, and
      # it is deterministic, so the same revision always gives the same verdict.
      - name: Scan the working tree
        run: |
          set -euo pipefail
          gitleaks dir . --config .gitleaks.toml --redact --exit-code 1

      # History is reported, never gated: this repository has a test canary in
      # old commits. Rewriting history would invalidate every SHA, CI run and
      # audit reference this repository depends on, and the canary is not a
      # credential. A clean working tree does NOT mean history is clean — this
      # step is what keeps that visible. If a scan ever reports something that
      # IS a real credential: rotate FIRST, then consider rewriting history.
      # Never the reverse, and never a blanket allowlist.
      - name: Report historical findings (advisory)
        if: always()
        run: |
          set -euo pipefail
          gitleaks git . --config .gitleaks.toml --redact \
            --report-path gitleaks-history.json --exit-code 0
          count=$(python3 -c "import json;print(len(json.load(open('gitleaks-history.json'))))")
          echo "historical findings: $count"
          if [ "$count" -gt 0 ]; then
            echo "::warning title=Secret scanning (advisory)::${count} finding(s) in git history. Current tree gate is green. See gitleaks-history.json."
          fi

      - name: Upload the history report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-report
          path: gitleaks-history.json
          retention-days: 30

  pip-audit:
    # Dependency audit — ADVISORY (continue-on-error) until triaged.
    # The offline dev env means advisories cannot be pre-triaged here, so a
    # hard gate would fail the build on unactionable findings. Ratchets to
    # blocking (remove continue-on-error) after triage — see HARD_TEST_REPORT.
    name: Dependency audit (pip-audit, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Run pip-audit (advisory — see job comment)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install safety bandit

      - name: Run Safety check (dependency vulnerabilities)
        run: safety check -r requirements.txt --output json || true
        continue-on-error: true

      - name: Run Bandit (code security)
        run: bandit -r app/ -f json -o bandit-report.json --severity-level medium || true
        continue-on-error: true

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: factory/Dockerfile
          push: false
          tags: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-smoke:
    name: API Image Ships Usable Data
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      # Regression gate for the P1 where `data/raw/*` is gitignored: the image
      # built from a clean clone shipped an empty data dir, /api/v1/health
      # still reported data_loaded=true (an empty dict is truthy), and
      # /api/v1/kpis, /api/v1/alerts, /api/v1/report all returned 500.
      # The 242-test suite never caught it because CI generates data BEFORE
      # pytest runs, so nothing exercised clean-clone -> image -> API.
      - name: Build API image from a clean clone
        run: docker build -f Dockerfile.api -t factory-api:smoke .

      - name: Confirm the image actually contains source data
        run: |
          set -euo pipefail
          count=$(docker run --rm --entrypoint sh factory-api:smoke -c \
            'ls -1 /app/data/raw/*.csv 2>/dev/null | wc -l')
          echo "CSVs in image: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::API image ships no data/raw CSVs; /api/v1/* will 500"
            exit 1
          fi

      - name: Start the container
        run: |
          docker run -d --name factory-api-smoke -p 8000:8000 factory-api:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              http://127.0.0.1:8000/api/v1/health || true)
            if [ "$code" = "200" ]; then echo "healthy after ${i}s"; exit 0; fi
            if [ "$code" = "503" ]; then
              echo "::error::health returned 503 — image shipped without usable data"
              docker logs factory-api-smoke
              exit 1
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs factory-api-smoke
          exit 1

      - name: Business endpoints must not 5xx
        run: |
          set -euo pipefail
          failed=0
          for path in /api/v1/data /api/v1/kpis /api/v1/alerts; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:8000$path")
            echo "$path -> $code"
            case "$code" in
              2*) ;;
              *) echo "::error::$path returned $code"; failed=1 ;;
            esac
          done
          [ "$failed" -eq 0 ]

      - name: Metrics must report data as loaded
        run: |
          set -euo pipefail
          curl -s http://127.0.0.1:8000/metrics | grep -q '^factory_data_up 1$' \
            || { echo "::error::factory_data_up is not 1 — data not loaded"; exit 1; }

      - name: Container logs
        if: always()
        run: docker logs factory-api-smoke || true
