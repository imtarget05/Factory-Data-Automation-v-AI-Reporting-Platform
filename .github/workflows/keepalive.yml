# Keepalive — defeats Render free-tier sleep (services spin down after ~15 min
# idle; the first request after sleep takes 30-60s cold start).
#
# This workflow pings the service /health URL every 14 minutes (inside the
# 15-min idle window) plus on manual dispatch. The URLs come from the
# RENDER_HEALTH_URL_FACTORY / RENDER_HEALTH_URL_FACTORY_UI secrets
# (Settings → Secrets → Actions); the defaults below are placeholders —
# replace them with the real service URLs after the first Render deploy.
#
# Forks without GitHub Actions: use https://cron-job.org instead — create a
# free account, add GET jobs to <your-api-url>/api/v1/health (and optionally
# the dashboard root) every 14 minutes.
name: Keepalive

"on":
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Render health endpoints
    runs-on: ubuntu-latest
    env:
      RENDER_HEALTH_URL_FACTORY: ${{ secrets.RENDER_HEALTH_URL_FACTORY }}
      RENDER_HEALTH_URL_FACTORY_UI: ${{ secrets.RENDER_HEALTH_URL_FACTORY_UI }}
    steps:
      - name: Ping factory-api + factory-dashboard (best-effort)
        run: |
          set -euo pipefail
          API_URL="${RENDER_HEALTH_URL_FACTORY:-https://factory-api.onrender.com/api/v1/health}"
          UI_URL="${RENDER_HEALTH_URL_FACTORY_UI:-https://factory-dashboard.onrender.com/}"
          for URL in "$API_URL" "$UI_URL"; do
            echo "Pinging $URL"
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "→ HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "::warning::Keepalive ping to $URL returned HTTP $STATUS (expected 200)."
            else
              echo "Service awake."
            fi
          done
