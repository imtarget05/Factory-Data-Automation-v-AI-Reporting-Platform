# Alembic configuration for the Factory Data Platform.
#
# WHY THE URL IS NOT HERE
# -----------------------
# `sqlalchemy.url` is intentionally left blank. Putting a DSN in this file means
# a connection string -- and therefore a credential -- gets committed. The URL is
# resolved at runtime by migrations/env.py from the application's own
# configuration, the same way the running app resolves it, so a migration can
# never point at a different database than the application does.
#
# Overriding for a one-off command is done with -x or with the environment, not
# by editing this file.

[alembic]
script_location = migrations
prepend_sys_path = .
# Empty on purpose; see above.
sqlalchemy.url =

# Timestamped, ordered revision filenames. The filename is the reviewable part:
# `0001_baseline_existing_schema` says what the revision does, a hash does not.
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 48

[post_write_hooks]
# No auto-format hook: `ruff format` in CI already covers migrations/, and a
# hook that rewrites files after every `alembic revision` makes the working tree
# dirty in a way that is easy to commit by accident.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S