# Service-Level Objectives for this repo.
#
# Every SLO carries: name, sli (PromQL or gate), target, window, error_budget, alert.
# `sli: gate` means the objective is enforced by a test/load harness, not by a metric.
# Ports match prometheus/prometheus.yml; see that file for the scrape list.
version: "1.0"

constants:
  P95_LATENCY_SECONDS: 2

targets:
  - job: factory
    port: 8002
    metrics_path: /metrics
    source: Factory-Data-Automation-v-AI-Reporting-Platform service (see prometheus/prometheus.yml)
    uncertain: false
  - job: llm-gateway
    port: 8787
    metrics_path: /metrics
    source: vendored llm-gateway/ in this repo
    uncertain: false

slos:

  - name: pipeline-freshness
    sli: factory_data_up
    target: 1
    window: 30d
    error_budget: 0
    alert: ServiceDown
    note: "0 means datasets are not loaded; the API degrades instead of serving stale KPIs silently."

  - name: alert-noise
    sli: factory_alerts_active
    target: 0
    window: 7d
    error_budget: 0
    alert: ServiceDown
    note: "Every active industrial alert is meant to be acknowledged."

